name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      ['playground/**', 'src/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:playground
        env:
          # Set these under Settings → Secrets and variables → Actions → Variables.
          VITE_SIGNALING_URL: ${{ vars.PLAYGROUND_SIGNALING_URL }}
          VITE_STUN_URLS: ${{ vars.PLAYGROUND_STUN_URLS || 'stun:stun.l.google.com:19302' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
